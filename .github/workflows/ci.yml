name: test
on: [push, pull_request]
env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev,viewer,quality]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: assetspheres fit examples/two_link.urdf --method cover --count 12 -o outputs/demo
      - run: assetspheres fit examples/two_link.urdf --count 12 --no-glb -o outputs/voxel
      - run: assetspheres report outputs/voxel/spheres.json --json
  geometry-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,quality,open3d,warp]'
      - run: pytest -q tests/test_voxelization.py tests/test_voxelization_concurrency.py tests/test_component_grids.py tests/test_cli.py
  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: >-
          python -m pip install -e '.[dev]'
          'numpy==1.24.0' 'scipy==1.10.0' 'trimesh==4.12.0'
          'PyYAML==6.0' 'defusedxml==0.7.0' 'pytest==7.0.0'
      - run: pytest -q
